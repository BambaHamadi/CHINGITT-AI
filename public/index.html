<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHINGITT AI</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--sf:#fff;--ink:#1B1C33;--mut:#6B6C80;--ac:#B5701A;--acf:#fff;--ln:#E4DFD3;--ub:#1B1C33;--ubt:#F6F3EC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101126;--sf:#1A1C3A;--ink:#F1EEE6;--mut:#9A9CB8;--ac:#FFB547;--acf:#1A1203;--ln:#2A2D54;--ub:#FFB547;--ubt:#1A1203;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101126;--sf:#1A1C3A;--ink:#F1EEE6;--mut:#9A9CB8;--ac:#FFB547;--acf:#1A1203;--ln:#2A2D54;--ub:#FFB547;--ubt:#1A1203;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.7 Tajawal,"Segoe UI",Tahoma,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.brand{flex:1;font:600 21px "Reem Kufi",Tajawal,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:none;border:1px solid var(--ln);width:40px;height:40px;border-radius:12px;font-size:18px;line-height:1}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#msgs{flex:1;overflow-y:auto;padding:16px 14px}
.m{display:flex;gap:10px;margin:0 0 18px}
.u .b{background:var(--ub);color:var(--ubt);padding:10px 14px;border-radius:18px 18px 18px 4px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.g{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-size:14px;margin-top:2px}
.a .b{flex:1;min-width:0;overflow-wrap:anywhere}
.b h4{margin:10px 0 4px;font-size:17px}.b ul{margin:6px 0;padding-inline-start:22px}
.b code{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:0 5px;font-size:.9em}
.code{position:relative;margin:8px 0;background:var(--sf);border:1px solid var(--ln);border-radius:12px}
.code pre{margin:0;padding:34px 12px 12px;overflow-x:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;text-align:left}
.cp,.cm{background:none;border:0;color:var(--mut);font-size:13px;padding:2px 8px}
.cp{position:absolute;top:4px;inset-inline-end:4px}
.hero{padding:18px 0 6px}
.hero h1{font:600 30px/1.3 "Reem Kufi",Tajawal,sans-serif;margin:0 0 6px}
.hero p{margin:0 0 18px;color:var(--mut)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{text-align:start;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.card b{font-size:16px}.card span{color:var(--mut);font-size:13px;line-height:1.5}
.cmp{padding:8px 14px 12px;border-top:1px solid var(--ln)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;background:none;border:1px solid var(--ln);padding:3px 13px;border-radius:999px;font-size:14px}
.chip.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:22px;padding:10px 16px;font:inherit;line-height:1.5}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:var(--acf);font-size:20px}
.mic{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--sf)}
.mic.on{background:#c0392b;color:#fff;border-color:#c0392b}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#ov.open{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);background:var(--bg);border-inline-start:1px solid var(--ln);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);gap:10px;box-sizing:border-box}
#dr.open{transform:none}
html[dir=ltr] #dr{right:auto;left:0;transform:translateX(-100%)}
html[dir=ltr] #dr.open{transform:none}
html[dir=ltr] .u .b{border-radius:18px 18px 4px 18px}
#hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.h{display:flex;align-items:center;border-radius:10px}
.h.on{background:var(--sf)}
.h button:first-child{flex:1;text-align:start;background:none;border:0;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h button+button{background:none;border:0;color:var(--mut);padding:8px 10px}
.btn{background:var(--ac);color:var(--acf);border:0;border-radius:12px;padding:10px;font-weight:700}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ln);font-weight:500}
.lbl{font-size:13px;color:var(--mut);margin:4px 0 -4px}
.tiers{display:flex;gap:6px}
.note{font-size:12px;color:var(--mut);line-height:1.6;margin:0}
#st{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:none;z-index:5}
@media(prefers-reduced-motion:reduce){#ov,#dr{transition:none}}
</style>
</head>
<body>
<div id="app">
<header>
<button class="ib" id="menu" aria-label="القائمة">☰</button>
<div class="brand" dir="ltr">CHINGITT AI</div>
<button class="ib" id="nw" aria-label="محادثة جديدة">＋</button>
</header>
<div id="msgs" aria-live="polite"></div>
<div class="cmp">
<div class="chips" id="chips"></div>
<div class="row">
<button class="mic" id="mic" hidden aria-label="إملاء صوتي">🎤</button>
<textarea id="ta" rows="1" dir="auto" placeholder="اكتب بأي لغة… Write in any language…"></textarea>
<button class="send" id="go" aria-label="إرسال">↑</button>
</div>
</div>
</div>
<div id="ov"></div>
<aside id="dr" aria-label="القائمة الجانبية">
<button class="btn" id="nw2">محادثة جديدة</button>
<div class="tiers" id="langs"></div>
<div class="lbl">محادثاتك</div>
<div id="hist"></div>
<div class="lbl">عمق الإجابة</div>
<div class="tiers" id="tiers"></div>
<button class="btn o" id="th">تبديل الوضع الليلي</button>
<button class="btn o" id="ex">حفظ المحادثة كملف</button>
<button class="btn o" id="clr">حذف كل المحادثات</button>
<p class="note">يدعم جميع اللغات. يعمل بنموذج Claude من Anthropic. محادثاتك محفوظة على جهازك فقط.</p>
</aside>
<div id="st" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const SYS="أنت «CHINGITT AI»، مساعد ذكاء اصطناعي عملي يتقن جميع لغات العالم. أجب دائماً بنفس اللغة التي يكتب بها المستخدم (أي لغة كانت، والعربية إن لم تتضح اللغة) وبنفس لهجته إن أمكن، بوضوح واختصار، بفقرات قصيرة وقوائم عند الحاجة، وتجنّب الجداول. إذا كان السؤال غامضاً فافترض أفضل تفسير وأجب.";
const MODES=[
{id:'chat',n:'محادثة',i:'💬',h:'اسأل عن أي شيء',p:''},
{id:'write',n:'كتابة',i:'✍️',h:'مقالات، رسائل، إعلانات',p:'ركّز على الكتابة: صغ نصوصاً جاهزة للاستخدام بأسلوب سليم وجذاب.'},
{id:'tr',n:'ترجمة',i:'🌐',h:'بين أي لغتين',p:'أنت مترجم محترف. ترجم النص إلى العربية، وإن كان عربياً فإلى الإنجليزية، ما لم يحدد المستخدم لغة. الترجمة أولاً ثم ملاحظة قصيرة عند الحاجة.'},
{id:'code',n:'برمجة',i:'💻',h:'كتابة الأكواد وإصلاحها',p:'أنت مهندس برمجيات خبير. اكتب كوداً صحيحاً ومختصراً داخل كتل أكواد مع شرح موجز.'},
{id:'sum',n:'تلخيص',i:'📝',h:'لخّص أي نص طويل',p:'لخّص النص في نقاط واضحة، مع الفكرة الرئيسية في سطر واحد أولاً.'},
{id:'edu',n:'تعلّم',i:'🎓',h:'شرح مبسّط بأمثلة',p:'أنت معلم صبور. اشرح خطوة بخطوة بأمثلة بسيطة، ثم اطرح سؤالاً قصيراً واحداً لاختبار الفهم.'},
{id:'img',n:'وصف صور',i:'🎨',h:'أوصاف جاهزة لمولّدات الصور',p:'حوّل فكرة المستخدم إلى وصف مفصّل جاهز للصق في مولّد صور (الموضوع، الأسلوب، الإضاءة، الألوان، الزاوية): وصف بالإنجليزية ثم وصف بالعربية.'},
{id:'biz',n:'أعمال',i:'📈',h:'تسويق وخطط وأفكار',p:'أنت مستشار أعمال وتسويق. قدّم خطوات عملية قابلة للتنفيذ ونصوصاً تسويقية جاهزة.'}
];
const TIERS=['quick','default','complex'];
const L={
ar:{dir:'rtl',n:'العربية',menu:'القائمة',nw:'محادثة جديدة',ph:'اكتب بأي لغة…',mic:'إملاء صوتي',send:'إرسال',hh:'كيف أساعدك اليوم؟',hp:'اختر مجالاً أو اكتب سؤالك مباشرة، بأي لغة وسأرد بها.',chats:'محادثاتك',none:'لا توجد محادثات بعد.',depth:'عمق الإجابة',tiers:['سريع','متوازن','معمّق'],th:'تبديل الوضع الليلي',ex:'حفظ المحادثة كملف',clr:'حذف كل المحادثات',clr2:'اضغط مرة أخرى للتأكيد',note:'يدعم جميع اللغات. يعمل بنموذج Claude من Anthropic. محادثاتك محفوظة على جهازك فقط.',copy:'نسخ',copied:'تم النسخ',cfail:'تعذّر النسخ',nomsg:'لا توجد رسائل لحفظها',sfail:'لم يتم حفظ الملف',dfail:'تعذّر تشغيل الإملاء الصوتي',stop:'تم الإيقاف.',eg:'لم تتم الموافقة على استخدام الذكاء الاصطناعي. أرسل مجدداً ووافق على الطلب.',er:'الطلبات كثيرة الآن. انتظر قليلاً ثم أعد المحاولة.',eu:'الخدمة غير متاحة هنا. سجّل الدخول إلى Claude ثم افتح الرابط مجدداً.',ex:'تعذّر الحصول على رد. أعد المحاولة.',m:{chat:['محادثة','اسأل عن أي شيء'],write:['كتابة','مقالات، رسائل، إعلانات'],tr:['ترجمة','بين أي لغتين'],code:['برمجة','كتابة الأكواد وإصلاحها'],sum:['تلخيص','لخّص أي نص طويل'],edu:['تعلّم','شرح مبسّط بأمثلة'],img:['وصف صور','أوصاف جاهزة لمولّدات الصور'],biz:['أعمال','تسويق وخطط وأفكار']}},
fr:{dir:'ltr',n:'Français',menu:'Menu',nw:'Nouvelle conversation',ph:'Écrivez dans n’importe quelle langue…',mic:'Dictée vocale',send:'Envoyer',hh:'Comment puis-je vous aider ?',hp:'Choisissez un domaine ou posez votre question, dans la langue de votre choix.',chats:'Vos conversations',none:'Aucune conversation pour le moment.',depth:'Profondeur de la réponse',tiers:['Rapide','Équilibré','Approfondi'],th:'Basculer le mode sombre',ex:'Enregistrer la conversation',clr:'Supprimer toutes les conversations',clr2:'Appuyez encore pour confirmer',note:'Toutes les langues sont prises en charge. Propulsé par Claude d’Anthropic. Vos conversations restent sur votre appareil.',copy:'Copier',copied:'Copié',cfail:'Copie impossible',nomsg:'Aucun message à enregistrer',sfail:'Fichier non enregistré',dfail:'Dictée vocale indisponible',stop:'Arrêté.',eg:'Autorisation refusée pour l’IA. Renvoyez le message et acceptez la demande.',er:'Trop de demandes. Patientez un instant puis réessayez.',eu:'Service indisponible ici. Connectez-vous à Claude puis rouvrez le lien.',ex:'Aucune réponse obtenue. Réessayez.',m:{chat:['Discussion','Posez toute question'],write:['Rédaction','Articles, messages, annonces'],tr:['Traduction','Entre toutes les langues'],code:['Code','Écrire et corriger du code'],sum:['Résumé','Résumez un long texte'],edu:['Apprendre','Explications simples, exemples'],img:['Prompts image','Descriptions prêtes pour générateurs d’images'],biz:['Business','Marketing, plans, idées']}},
en:{dir:'ltr',n:'English',menu:'Menu',nw:'New chat',ph:'Write in any language…',mic:'Voice dictation',send:'Send',hh:'How can I help today?',hp:'Pick a topic or ask your question directly, in any language.',chats:'Your chats',none:'No chats yet.',depth:'Answer depth',tiers:['Fast','Balanced','Deep'],th:'Toggle dark mode',ex:'Save chat as file',clr:'Delete all chats',clr2:'Tap again to confirm',note:'All languages supported. Powered by Claude from Anthropic. Your chats stay on your device.',copy:'Copy',copied:'Copied',cfail:'Could not copy',nomsg:'No messages to save',sfail:'File not saved',dfail:'Voice dictation unavailable',stop:'Stopped.',eg:'AI permission was not granted. Send again and accept the request.',er:'Too many requests. Wait a moment and try again.',eu:'Service unavailable here. Sign in to Claude and reopen the link.',ex:'No reply received. Try again.',m:{chat:['Chat','Ask anything'],write:['Writing','Articles, messages, ads'],tr:['Translate','Between any languages'],code:['Code','Write and fix code'],sum:['Summarize','Condense any long text'],edu:['Learn','Simple explanations, examples'],img:['Image prompts','Ready descriptions for image generators'],biz:['Business','Marketing, plans, ideas']}}
};
const T=()=>L[S.lang]||L.ar;
let S=null;try{S=JSON.parse(localStorage.getItem('rafiq1')||'null')}catch(e){}
if(!S||!S.chats)S={chats:[],cur:null,tier:'default',theme:''};
if(!S.lang)S.lang=/^fr/i.test(navigator.language)?'fr':/^en/i.test(navigator.language)?'en':'ar';
const save=()=>{try{localStorage.setItem('rafiq1',JSON.stringify(S))}catch(e){}};
if(S.theme)document.documentElement.dataset.theme=S.theme;
function newChat(mode){
 const f=S.chats[0];
 if(f&&!f.messages.length){f.mode=mode||'chat';S.cur=f.id;return f}
 const c={id:Date.now().toString(36),title:'محادثة جديدة',mode:mode||'chat',messages:[]};
 S.chats.unshift(c);S.cur=c.id;return c;
}
const cur=()=>S.chats.find(c=>c.id===S.cur)||newChat();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){
 return t.split('```').map((p,i)=>{
  if(i%2){const n=p.indexOf('\n');const code=n>=0?p.slice(n+1):p;return '<div class="code"><button class="cp">'+T().copy+'</button><pre>'+esc(code.replace(/\n$/,''))+'</pre></div>'}
  let h=esc(p).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4} (.*)$/gm,'<h4>$1</h4>');
  h=h.replace(/(^|\n)((?:[-*•] .*(?:\n|$))+)/g,(m,a,l)=>a+'<ul>'+l.trim().split('\n').map(x=>'<li>'+x.replace(/^[-*•] /,'')+'</li>').join('')+'</ul>');
  return h.replace(/\n/g,'<br>').replace(/<\/(ul|h4)><br>/g,'</$1>').replace(/<br>(<ul|<h4)/g,'$1');
 }).join('');
}
let busy=false,ac=null,tm=0;
function toast(t){const e=$('#st');e.textContent=t;e.style.display='block';clearTimeout(tm);tm=setTimeout(()=>e.style.display='none',4500)}
function copy(t){
 const ok=()=>toast(T().copied);
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
 function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast(T().cfail)}a.remove()}
}
function render(){
 const c=cur(),box=$('#msgs'),last=c.messages.length-1;
 if(!c.messages.length){
  box.innerHTML='<div class="hero"><h1>'+T().hh+'</h1><p>'+T().hp+'</p></div><div class="cards">'+MODES.map(m=>'<button class="card" data-mode="'+m.id+'"><b>'+m.i+' '+T().m[m.id][0]+'</b><span>'+T().m[m.id][1]+'</span></button>').join('')+'</div>';
 }else box.innerHTML=c.messages.map((m,i)=>m.role==='user'
  ?'<div class="m u"><div class="b" dir="auto">'+esc(m.content)+'</div></div>'
  :'<div class="m a"><div class="g">✦</div><div class="b" dir="auto">'+(m.content?md(m.content):'…')+(m.content&&!(busy&&i===last)?'<div><button class="cm" data-i="'+i+'">'+T().copy+'</button></div>':'')+'</div></div>').join('');
 $('#chips').innerHTML=MODES.map(m=>'<button class="chip'+(m.id===c.mode?' on':'')+'" data-mode="'+m.id+'">'+m.i+' '+T().m[m.id][0]+'</button>').join('');
 $('#go').textContent=busy?'■':'↑';
 box.scrollTop=box.scrollHeight;
}
function hist(){
 $('#hist').innerHTML=S.chats.filter(c=>c.messages.length).map(c=>'<div class="h'+(c.id===S.cur?' on':'')+'"><button data-open="'+c.id+'">'+esc(c.title)+'</button><button data-del="'+c.id+'" aria-label="حذف">✕</button></div>').join('')||'<p class="note">'+T().none+'</p>';
 $('#tiers').innerHTML=TIERS.map((t,i)=>'<button class="chip'+(t===S.tier?' on':'')+'" data-tier="'+t+'">'+T().tiers[i]+'</button>').join('');
}
const dr=o=>{$('#dr').classList.toggle('open',o);$('#ov').classList.toggle('open',o);if(o)hist()};
const sampleP=window.claude?claude.use('sample'):Promise.resolve(null);
async function send(){
 if(busy){ac&&ac.abort();return}
 const ta=$('#ta'),txt=ta.value.trim();if(!txt)return;
 const c=cur(),a={role:'assistant',content:''};
 c.messages.push({role:'user',content:txt},a);
 if(c.messages.length===2)c.title=txt.slice(0,36);
 ta.value='';ta.style.height='auto';busy=true;ac=new AbortController();render();
 try{
  const sm=await sampleP;if(!sm)throw{code:'unavailable'};
  const mode=MODES.find(m=>m.id===c.mode)||MODES[0];
  let msgs=c.messages.slice(0,-1).slice(-20).map(m=>({role:m.role,content:m.content}));
  while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  msgs[0].content='[تعليمات النظام: '+SYS+' '+mode.p+' If the user’s language is unclear, use '+T().n+'.]\n\n'+msgs[0].content;
  const r=await sm(msgs,{cache:false,modelTier:S.tier,signal:ac.signal,onText:({text})=>{a.content=text;const b=document.querySelectorAll('.m.a .b');const e=b[b.length-1];if(e){e.innerHTML=md(text);$('#msgs').scrollTop=$('#msgs').scrollHeight}}});
  a.content=r.text;
 }catch(e){
  if(!a.content&&!(ac&&ac.signal.aborted)){
   c.messages.splice(-2,2);ta.value=txt;
   const k=e&&e.code;
   toast(k==='not_granted'?T().eg:k==='rate_limited'?T().er:k==='unavailable'?T().eu:T().ex);
  }else if(!a.content)a.content=T().stop;
 }
 busy=false;ac=null;save();render();
}
$('#go').onclick=send;
const ta=$('#ta');
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px'});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}});
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 const c=cur();
 if(t.dataset.mode){c.mode=t.dataset.mode;save();render();ta.focus()}
 else if(t.classList.contains('cp'))copy(t.parentNode.querySelector('pre').textContent);
 else if(t.classList.contains('cm'))copy(c.messages[+t.dataset.i].content);
 else if(t.dataset.open){S.cur=t.dataset.open;save();render();dr(false)}
 else if(t.dataset.del){S.chats=S.chats.filter(x=>x.id!==t.dataset.del);if(S.cur===t.dataset.del)S.cur=null;save();cur();render();hist()}
 else if(t.dataset.tier){S.tier=t.dataset.tier;save();hist()}
 else if(t.dataset.lang){S.lang=t.dataset.lang;applyLang();render();hist()}
});
const fresh=()=>{if(busy)return;newChat();save();render();dr(false);ta.focus()};
$('#nw').onclick=fresh;$('#nw2').onclick=fresh;
$('#menu').onclick=()=>dr(true);$('#ov').onclick=()=>dr(false);
$('#th').onclick=()=>{const d=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=d?'light':'dark';document.documentElement.dataset.theme=S.theme;save()};
let ct=0;
$('#clr').onclick=e=>{
 if(!ct){e.target.textContent=T().clr2;ct=setTimeout(()=>{ct=0;e.target.textContent=T().clr},3000);return}
 clearTimeout(ct);ct=0;e.target.textContent=T().clr;S.chats=[];S.cur=null;save();cur();render();hist();
};
(window.claude?claude.use('downloads'):Promise.resolve(null)).then(d=>{
 if(!d){$('#ex').hidden=true;return}
 $('#ex').onclick=async()=>{
  const c=cur();if(!c.messages.length)return toast(T().nomsg);
  const data=c.messages.map(m=>(m.role==='user'?'You: ':'CHINGITT AI: ')+m.content).join('\n\n');
  try{await d.save({filename:'chingitt-chat.txt',data})}catch(e){toast(T().sfail)}
 };
}).catch(()=>{$('#ex').hidden=true});
(window.claude?claude.use('dictation'):Promise.resolve(null)).then(d=>{
 if(!d)return;
 const mic=$('#mic');mic.hidden=false;
 d.onFinal(({text})=>{ta.value=(ta.value+' '+text).trim();ta.dispatchEvent(new Event('input'))});
 d.onState(({state})=>mic.classList.toggle('on',state==='listening'));
 mic.onclick=()=>{mic.classList.contains('on')?d.stop():d.start().catch(()=>toast(T().dfail))};
}).catch(()=>{});
function applyLang(){
 const t=T(),d=document.documentElement;d.lang=S.lang;d.dir=t.dir;
 $('#menu').setAttribute('aria-label',t.menu);$('#nw').setAttribute('aria-label',t.nw);$('#go').setAttribute('aria-label',t.send);$('#mic').setAttribute('aria-label',t.mic);
 $('#ta').placeholder=t.ph;$('#nw2').textContent=t.nw;$('#th').textContent=t.th;$('#ex').textContent=t.ex;$('#clr').textContent=t.clr;
 const l=document.querySelectorAll('.lbl');l[0].textContent=t.chats;l[1].textContent=t.depth;$('#dr>.note').textContent=t.note;
 $('#langs').innerHTML=Object.keys(L).map(k=>'<button class="chip'+(k===S.lang?' on':'')+'" data-lang="'+k+'">'+L[k].n+'</button>').join('');
 save();
}
applyLang();
render();
})();
</script>
</body>
</html>
